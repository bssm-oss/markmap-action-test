name: Generate and Deploy Markmap

on:
  push:
    paths:
      - '**/*.md'
      - '.github/workflows/markmap.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: bssm-oss/markmap-actions@main
        with:
          files: '**/*.md'
          output-dir: '.markmap'
          format: 'html'
          toolbar: 'true'
          commit: 'false'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.markmap'

      - id: deploy
        uses: actions/deploy-pages@v4
