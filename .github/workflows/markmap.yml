name: Generate Markmap

on:
  push:
    paths:
      - '**/*.md'
      - '.github/workflows/markmap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  markmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bssm-oss/markmap-actions@main
        with:
          files: '**/*.md'
          output-dir: '.markmap'
          toolbar: 'true'
          offline: 'false'
          commit-message: 'chore: update markmap visualizations [skip ci]'
